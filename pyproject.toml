[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwh-gridbuilder"
version = "0.1.0"
description = "Power-grid models from OpenStreetMap — the Facetwork/FFL equivalent of PyPSA grid-builder"
requires-python = ">=3.11"
dependencies = [
    "facetwork>=0.31.0",
    "earth-osm>=3.0.0",
]

[project.optional-dependencies]
# s3:// output. The fleet image already carries boto3 (facetwork[s3]); this is
# for a standalone install that wants to write to MinIO.
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

[project.entry-points."facetwork.domains"]
gridbuilder = "gridbuilder:domain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridbuilder = ["ffl/*.ffl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
